name: Update news

on:
  schedule:
    - cron: "*/30 * * * *"   # har 30 minute mein
  workflow_dispatch:          # haath se bhi chala sakte hain

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch news and build page
        run: python3 hyperlocal_news.py Patna --lang hi,en --out index.html
      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Update news" && git push)
